apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  destination:
    namespace: o11y
    name: in-cluster
  project: default
  source:
    path: kubernetes/apps/grafana/overlays/prod
    repoURL: https://github.com/csobrinho/homelab
  ignoreDifferences: []
