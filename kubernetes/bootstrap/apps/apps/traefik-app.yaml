apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
spec:
  destination:
    namespace: traefik
    name: in-cluster
  project: default
  source:
    path: kubernetes/apps/traefik/overlays/prod
    repoURL: https://github.com/csobrinho/homelab
  ignoreDifferences: []
