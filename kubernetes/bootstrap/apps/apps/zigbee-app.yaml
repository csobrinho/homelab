apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zigbee
  namespace: argocd
spec:
  destination:
    namespace: home-assistant
    name: in-cluster
  project: default
  source:
    path: kubernetes/apps/zigbee/overlays/prod
    repoURL: https://github.com/csobrinho/homelab
  ignoreDifferences: []
