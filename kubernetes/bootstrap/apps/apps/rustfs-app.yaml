apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
  namespace: argocd
spec:
  destination:
    namespace: rustfs
    name: in-cluster
  project: default
  source:
    path: kubernetes/apps/rustfs/overlays/prod
    repoURL: https://github.com/csobrinho/homelab
  ignoreDifferences: []
