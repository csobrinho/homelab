apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: talos-backup
  namespace: argocd
spec:
  destination:
    namespace: kube-system
    name: in-cluster
  project: default
  source:
    path: kubernetes/apps/talos-backup/overlays/prod
    repoURL: https://github.com/csobrinho/homelab
  ignoreDifferences: []
