kind: Application
metadata:
  name: cyberchef
  namespace: argocd
spec:
  destination:
    namespace: cyberchef
    name: in-cluster
  project: default
  source:
    path: kubernetes/apps/cyberchef/overlays/prod
    repoURL: https://github.com/csobrinho/homelab
  ignoreDifferences: []
