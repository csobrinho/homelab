# From https://github.com/trueforge-org/truecharts/blob/master/charts/library/common/values.yaml
# From https://github.com/trueforge-org/truecharts/blob/master/charts/stable/lidarr/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: lidarr
    repo: oci://oci.trueforge.org/truecharts
    releaseName: lidarr
    namespace: media
    version: 29.7.3
    includeCRDs: true
    valuesInline:
      TZ: America/Los_Angeles
      podOptions:
        nodeSelector:
          kubernetes.io/arch: "amd64"
      persistence:
        config:
          enabled: true
          existingClaim: lidarr-config
        data:
          enabled: true
          type: nfs
          server: infra-vm
          path: /mnt/library
          mountPath: /data
      resources:
        limits:
          cpu: 250m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
      metrics:
        main:
          enabled: false # Disabled until pvc reusage due to exportarr is fixed.

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: lidarr-kopiur
    namespace: media
    version: 0.1.0
    valuesInline:
      # yaml-language-server: $schema=https://raw.githubusercontent.com/csobrinho/helm-charts/refs/heads/main/charts/kopiur-pvc/values.schema.json
      uid: 568
      gid: 568
      persistence:
        lidarr-config:
          retain: true
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 5Gi

components:
  - ../../../../components/managed-sablier
