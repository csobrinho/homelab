# From https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
# Based on: https://github.com/onedr0p/home-ops/blob/07e3edc9d97bb94c96e713d7480d6aa3b111e9d2/kubernetes/apps/o11y/kube-prometheus-stack/app/helmrelease.yaml
cleanPrometheusOperatorObjectNames: true

alertmanager:
  alertmanagerSpec:
    alertmanagerConfiguration:
      name: alertmanager
    externalUrl: https://alertmanager.sobrinho.pt
    storage:
      volumeClaimTemplate:
        spec:
          enabled: true
          retain: true
          storageClass: local-data
          accessModes:
            - ReadWriteOnce
          size: 1Gi

kubeEtcd:
  service:
    selector:
      component: kube-apiserver # etcd runs on control plane nodes

kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    externalUrl: https://prometheus.sobrinho.pt
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 30d
    retentionSize: 40GiB
    enableAdminAPI: true
    additionalArgs:
      - name: storage.tsdb.no-lockfile # To avoid issues when the container is forced killed.
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          enabled: true
          retain: true
          storageClass: local-db
          accessModes:
            - ReadWriteOnce
          size: 50Gi
  service:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/sharing-key: infra-prometheus
      lbipam.cilium.io/sharing-cross-namespace: o11y
      external-dns.alpha.kubernetes.io/hostname: infra-prometheus
    labels:
      io.cilium/lb-pool: pool-infra-prometheus

prometheus-node-exporter:
  fullnameOverride: node-exporter

kube-state-metrics:
  fullnameOverride: kube-state-metrics

grafana:
  enabled: false
  forceDeployDashboards: true
  operator:
    dashboardsConfigMapRefEnabled: true
    folder: o11y
    matchLabels:
      dashboards: grafana

additionalPrometheusRulesMap:
  dockerhub-rules:
    groups:
      - name: dockerhub
        rules:
          - alert: DockerhubRateLimitRisk
            annotations:
              summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
            expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
            labels:
              severity: critical
  oom-rules:
    groups:
      - name: oom
        rules:
          - alert: OomKilled
            annotations:
              summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
            expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
            labels:
              severity: critical
  zfs-rules:
    groups:
      - name: zfs
        rules:
          - alert: ZfsUnexpectedPoolState
            annotations:
              summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
            expr: node_zfs_zpool_state{state!="online"} > 0
            labels:
              severity: critical
