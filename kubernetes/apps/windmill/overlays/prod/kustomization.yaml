# From https://github.com/windmill-labs/windmill-helm-charts/blob/main/charts/windmill/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml
  - postgresql-database.yaml
  - secrets/windmill-secret-enc.yaml

helmCharts:
  - name: windmill
    repo: https://windmill-labs.github.io/windmill-helm-charts/
    releaseName: windmill
    namespace: windmill
    version: 4.0.280
    includeCRDs: true
    valuesInline:
      postgresql:
        enabled: false
      windmill:
        baseDomain: windmill.sobrinho.pt
        baseProtocol: https
        appReplicas: 1
        frontendReplicas: 1
        workerReplicas: 2
        lspReplicas: 1
        app:
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
        databaseUrlSecretName: "windmill-secret"
        databaseUrlSecretKey: url
      ingress:
        enabled: false
      enterprise:
        enabled: false


components:
  - ../../../../components/disable-revision-history
