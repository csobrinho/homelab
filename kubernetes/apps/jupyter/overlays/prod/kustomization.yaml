# See https://github.com/jupyterhub/zero-to-jupyterhub-k8s/blob/main/jupyterhub/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: jupyterhub
    repo: https://hub.jupyter.org/helm-chart/
    releaseName: jupyter
    namespace: jupyter
    version: 4.4.1
    includeCRDs: true
    valuesInline:
      hub:
        extraEnv:
          TZ: America/Los_Angeles
        db:
          pvc:
            storageClassName: "ceph-block"
        config:
          Authenticator:
            admin_users:
              - sobrinho
          DummyAuthenticator:
            password: admin
          JupyterHub:
            authenticator_class: dummy
          IdentityProvider:
            token: ""
      prePuller:
        continuous:
          enabled: false
        hook:
          enabled: false
      proxy:
        service:
          type: ClusterIP
      singleuser:
        uid: 0
        fsGid: 0
        allowPrivilegeEscalation: true
        defaultUrl: /lab
        extraEnv:
          CHOWN_HOME: "yes"
          CHOWN_HOME_OPTS: -R
          GRANT_SUDO: "yes"
          NOTEBOOK_ARGS: "--allow-root"
        extraPodConfig:
          securityContext:
            fsGroup: 100
        storage:
          dynamic:
            pvcNameTemplate: jupyter-pvc-{username}
            volumeNameTemplate: jupyter-pv-{username}
            storageClass: "ceph-block"
          capacity: 5Gi
          homeMountPath: /home/jovyan
          # Disable until the helm chart is fixed?
          # extraVolumeMounts:
          #   - mountPath: /dev/bus/usb
          #     name: dev-bus-usb
          # extraVolumes:
          #   - hostPath:
          #       path: /dev/bus/usb
          #       type: Directory
          #     name: dev-bus-usb
        nodeSelector:
          feature.node.kubernetes.io/usb-chipwhisperer.present: "true"
        image:
          name: ghcr.io/csobrinho/jupyter-singleuser-hardware
          tag: main

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: jupyter-kopiur
    namespace: jupyter
    version: 0.1.0
    valuesInline:
      # yaml-language-server: $schema=https://raw.githubusercontent.com/csobrinho/helm-charts/refs/heads/main/charts/kopiur-pvc/values.schema.json
      persistence:
        hub-db-dir:
          existingClaim: true
      backup: # Must run as root.
        schedule:
          cron: "" # Disable the automatic backup schedule.
        mover:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          podSecurityContext:
            fsGroup: 0
      populate:
        mover:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          podSecurityContext:
            fsGroup: 0

components:
  - ../../../../components/managed-sablier
