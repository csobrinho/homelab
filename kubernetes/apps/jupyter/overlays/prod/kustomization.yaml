# See https://github.com/jupyterhub/zero-to-jupyterhub-k8s/blob/main/jupyterhub/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml
  - secrets/jupyter-auth-enc.yaml

helmCharts:
  - name: jupyterhub
    repo: https://hub.jupyter.org/helm-chart/
    releaseName: jupyter
    namespace: jupyter
    version: 4.4.2
    includeCRDs: true
    valuesInline:
      hub:
        extraEnv:
          TZ: America/Los_Angeles
          JUPYTERHUB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: jupyter-auth
                key: username
          JUPYTERHUB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: jupyter-auth
                key: password
        extraConfig:
          auth.py: |
            import os
            c.Authenticator.admin_users = {os.environ["JUPYTERHUB_USERNAME"]}
            c.SharedPasswordAuthenticator.admin_password = os.environ["JUPYTERHUB_PASSWORD"]
        db:
          type: other
          url: sqlite:////srv/jupyterhub/jupyterhub.sqlite
          upgrade: true
        extraVolumes:
          - name: hub-db-dir
            persistentVolumeClaim:
              claimName: hub-db-dir
        extraVolumeMounts:
          - name: hub-db-dir
            mountPath: /srv/jupyterhub
        podSecurityContext:
          fsGroup: 568
        containerSecurityContext:
          runAsUser: 568
          runAsGroup: 568
        config:
          JupyterHub:
            authenticator_class: shared-password
          IdentityProvider:
            token: ""
      prePuller:
        continuous:
          enabled: false
        hook:
          enabled: false
      proxy:
        service:
          type: ClusterIP
      singleuser:
        uid: 568
        fsGid: 100 # docker-stacks: /opt/conda and home are group-writable for `users` (100).
        defaultUrl: /lab
        storage:
          dynamic:
            pvcNameTemplate: jupyter-pvc-{username}
            volumeNameTemplate: jupyter-pv-{username}
            storageClass: local-data
          capacity: 5Gi
          homeMountPath: /home/jovyan
          # Disable until the helm chart is fixed?
          # extraVolumeMounts:
          #   - mountPath: /dev/bus/usb
          #     name: dev-bus-usb
          # extraVolumes:
          #   - hostPath:
          #       path: /dev/bus/usb
          #       type: Directory
          #     name: dev-bus-usb
        image:
          name: quay.io/jupyter/base-notebook
          tag: 2026-09-29@sha256:4ef9cfd552d265799bd9e959a87fb674da8cea738145ce49e7d286cb967ad1d7

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: jupyter-kopiur
    namespace: jupyter
    version: 0.1.0
    valuesInline:
      uid: 568
      gid: 568
      persistence:
        hub-db-dir:
          retain: true
          accessMode: ReadWriteOnce
          size: 1Gi
          storageClass: local-db

components:
  - ../../../../components/managed-sablier
