# See https://github.com/jupyterhub/zero-to-jupyterhub-k8s/blob/main/jupyterhub/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: jupyterhub
    repo: https://hub.jupyter.org/helm-chart/
    releaseName: jupyter
    namespace: jupyter
    version: 4.4.2
    includeCRDs: true
    valuesInline:
      hub:
        extraEnv:
          TZ: America/Los_Angeles
        db:
          type: other
          url: sqlite:////srv/jupyterhub/jupyterhub.sqlite
          upgrade: true
        extraVolumes:
          - name: hub-db-dir
            persistentVolumeClaim:
              claimName: hub-db-dir
        extraVolumeMounts:
          - name: hub-db-dir
            mountPath: /srv/jupyterhub
        podSecurityContext:
          fsGroup: 568
        containerSecurityContext:
          runAsUser: 568
          runAsGroup: 568
        config:
          Authenticator:
            admin_users:
              - sobrinho
          DummyAuthenticator:
            password: admin
          JupyterHub:
            authenticator_class: dummy
          IdentityProvider:
            token: ""
      prePuller:
        continuous:
          enabled: false
        hook:
          enabled: false
      proxy:
        service:
          type: ClusterIP
      singleuser:
        uid: 568
        fsGid: 568
        defaultUrl: /lab
        storage:
          dynamic:
            pvcNameTemplate: jupyter-pvc-{username}
            volumeNameTemplate: jupyter-pv-{username}
            storageClass: local-data
          capacity: 5Gi
          homeMountPath: /home/jovyan
          # Disable until the helm chart is fixed?
          # extraVolumeMounts:
          #   - mountPath: /dev/bus/usb
          #     name: dev-bus-usb
          # extraVolumes:
          #   - hostPath:
          #       path: /dev/bus/usb
          #       type: Directory
          #     name: dev-bus-usb
        image:
          name: ghcr.io/csobrinho/jupyter-singleuser-hardware
          tag: main

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: jupyter-kopiur
    namespace: jupyter
    version: 0.1.0
    valuesInline:
      uid: 568
      gid: 568
      persistence:
        hub-db-dir:
          retain: true
          accessMode: ReadWriteOnce
          size: 1Gi
          storageClass: local-db

components:
  - ../../../../components/managed-sablier
