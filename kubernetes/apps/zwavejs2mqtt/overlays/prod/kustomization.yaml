# From https://github.com/trueforge-org/truecharts/blob/master/charts/library/common/values.yaml
# From https://github.com/trueforge-org/truecharts/blob/master/charts/stable/zwavejs2mqtt/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: zwavejs2mqtt
    repo: oci://oci.trueforge.org/truecharts
    releaseName: zwavejs2mqtt
    namespace: home-assistant
    version: 25.20.2
    includeCRDs: true
    valuesInline:
      TZ: America/Los_Angeles
      podOptions:
        defaultAffinity: false
      workload:
        main:
          podSpec:
            containers:
              main:
                env:
                  # One hop (Traefik): trust its X-Forwarded-For so express-rate-limit sees the real
                  # client IP (ERR_ERL_UNEXPECTED_X_FORWARDED_FOR). `true` is too permissive.
                  TRUST_PROXY: "1"
      service:
        ws:
          enabled: true
          type: NodePort # FIXME: HomeAssistant uses host networking and in another cluster.
          ports:
            ws:
              enabled: true
              nodePort: 30046
              targetPort: 3000
      securityContext:
        container:
          readOnlyRootFilesystem: true
      persistence:
        config:
          enabled: true
          existingClaim: zwavejs2mqtt-config
      # /dev/zwave is allocated by generic-device-plugin.
      resources:
        limits:
          devic.es/zwave: 1

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: zwavejs2mqtt-kopiur
    namespace: home-assistant
    version: 0.1.0
    valuesInline:
      # yaml-language-server: $schema=https://raw.githubusercontent.com/csobrinho/helm-charts/refs/heads/main/charts/kopiur-pvc/values.schema.json
      uid: 568
      gid: 568
      persistence:
        zwavejs2mqtt-config:
          retain: true
          accessMode: ReadWriteOnce
          size: 512Mi
          storageClass: local-data

components:
  - ../../../../components/disable-revision-history
