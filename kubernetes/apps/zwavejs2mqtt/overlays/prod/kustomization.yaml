# From https://github.com/trueforge-org/truecharts/blob/master/charts/library/common/values.yaml
# From https://github.com/trueforge-org/truecharts/blob/master/charts/stable/zwavejs2mqtt/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: zwavejs2mqtt
    repo: oci://oci.trueforge.org/truecharts
    releaseName: zwavejs2mqtt
    namespace: home-assistant
    version: 25.20.1
    includeCRDs: true
    valuesInline:
      TZ: America/Los_Angeles
      podOptions:
        defaultAffinity: false
      service:
        ws:
          enabled: true
          type: NodePort # HomeAssistant uses host networking.
          ports:
            ws:
              enabled: true
              nodePort: 30046
              targetPort: 3000
      securityContext:
        container:
          readOnlyRootFilesystem: true
          privileged: false
          runAsNonRoot: false
          runAsGroup: 0
          runAsUser: 0
      persistence:
        config:
          enabled: true
          retain: true
          storageClass: "ceph-block"
          accessMode: ReadWriteOnce
          size: 1Gi
      # The stick is allocated by generic-device-plugin, not hostPath: the scheduler places the pod
      # on whichever node has it and it shows up as /dev/zwave (set that as the serial port in the
      # Z-Wave JS UI).
      resources:
        limits:
          devic.es/zwave: 1
