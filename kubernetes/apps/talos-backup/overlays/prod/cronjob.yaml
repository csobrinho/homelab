---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup-secrets
  namespace: kube-system
spec:
  roles:
    - os:etcd:backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-backup
  namespace: kube-system
spec:
  schedule: "0 */3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: talos-backup
              image: ghcr.io/siderolabs/talos-backup:latest@sha256:5e424bfe9e93532e096cc7c450d2baddb400cd0d146b41b5bf313cb34071c3e9
              workingDir: /tmp
              imagePullPolicy: IfNotPresent
              env:
                - name: CUSTOM_S3_ENDPOINT
                  value: https://s3.sobrinho.pt
                - name: USE_PATH_STYLE
                  value: "true"
                - name: BUCKET
                  value: etcd
                - name: CLUSTER_NAME
                  value: talos
              envFrom:
                - secretRef:
                    name: s3-etcd-secret
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /talos-backup
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /.talos
                  name: talos
                - mountPath: /var/run/secrets/talos.dev
                  name: talos-secrets
          restartPolicy: OnFailure
          volumes:
            - emptyDir: {}
              name: tmp
            - emptyDir: {}
              name: talos
            - name: talos-secrets
              secret:
                secretName: talos-backup-secrets
