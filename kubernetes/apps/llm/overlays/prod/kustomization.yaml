# From https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/explorer/
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One app-template release per workload (big LLM on gpu1; small LLMs, TTS, STT
# on gpu0 later). GPU claims come from apps/resource-claims.

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  # OpenAI-compatible API at http://vllm.llm.svc.cluster.local:8000/v1.
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    releaseName: vllm
    version: 5.2.1
    namespace: llm
    valuesFile: values-empty.yaml
    valuesInline:
      controllers:
        vllm:
          strategy: Recreate # One GPU; the new pod can't get a claim until the old one is gone.
          pod:
            securityContext:
              runAsNonRoot: true
              runAsUser: &uid 568
              runAsGroup: *uid
              fsGroup: *uid
              fsGroupChangePolicy: OnRootMismatch
              supplementalGroups: [*uid]
              seccompProfile:
                type: RuntimeDefault
            resourceClaims:
              - name: llm-gpu1
                resourceClaimTemplateName: llm-gpu1 # All of GPU 1.
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
          containers:
            app:
              image:
                repository: vllm/vllm-openai # CUDA 13 build; has sm_120 (RTX 5090) kernels.
                tag: v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
                pullPolicy: IfNotPresent
              # Entrypoint is `vllm serve`.
              # Qwen3.8-27B in NVFP4 (~22GB on disk, W4A4 on Blackwell) + its built-in
              # MTP head for speculative decoding + FP8 KV cache on one 32GB card.
              # Weights take ~20.7GiB, leaving ~6GiB of KV: enough for ~150K tokens,
              # not the full 256K (needs ~9.1GiB). TurboQuant KV is known to break
              # with spec decode.
              #
              # To try Qwen's official FP8 instead (~31GB, better fidelity):
              #   - One card: model Qwen/Qwen3.8-27B-FP8, drop --max-model-len to ~16384
              #     (almost nothing is left for KV).
              #   - Both cards: claim llm-gpus (pod + container) + --tensor-parallel-size=2.
              # To try DFlash2 instead of MTP (reported faster by some, needs a vLLM
              # build with DFlash2 and may require --kv-cache-dtype=auto):
              #   --speculative-config={"method":"dflash","model":"z-lab/Qwen3.8-27B-DFlash2","num_speculative_tokens":6}
              args:
                - nvidia/Qwen3.8-27B-NVFP4
                - --served-model-name=qwen3.8-27b
                - --host=0.0.0.0
                - --port=8000
                - --max-model-len=131072
                - --kv-cache-dtype=fp8_e4m3
                - --gpu-memory-utilization=0.97
                - --max-num-seqs=4
                - --enable-prefix-caching
                - --reasoning-parser=qwen3
                - --enable-auto-tool-choice
                - --tool-call-parser=qwen3_coder
                - '--speculative-config={"method":"mtp","num_speculative_tokens":2}'
              env:
                TZ: America/Los_Angeles
                # Everything cacheable (weights, FlashInfer JIT, Triton, torch.compile)
                # lives on the models PVC so restarts skip the download/compile.
                HOME: /models/home
                HF_HOME: /models/huggingface
                TORCHINDUCTOR_CACHE_DIR: /models/home/.cache/torchinductor
                USER: vllm # getpass.getuser() fails for a uid without a passwd entry.
              probes:
                liveness: &probe
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /health
                      port: &port 8000
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 5
                readiness:
                  <<: *probe
                  spec:
                    httpGet:
                      path: /health
                      port: *port
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                startup:
                  <<: *probe
                  spec:
                    httpGet:
                      path: /health
                      port: *port
                    # First boot downloads ~22GB and JIT-compiles kernels: allow 1h.
                    periodSeconds: 20
                    timeoutSeconds: 5
                    failureThreshold: 180
              resources:
                requests:
                  cpu: "2"
                  memory: 16Gi
                limits:
                  memory: 40Gi # Weight loading + CUDA graph capture are RAM-hungry.
                claims:
                  - name: llm-gpu1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities: { drop: ["ALL"] }
      service:
        app:
          controller: vllm
          ports:
            http:
              port: *port
      persistence:
        models:
          type: persistentVolumeClaim
          forceRename: vllm-models
          # Weights are re-downloadable: no kopiur backup.
          # NVFP4 ~22GB + FP8 ~31GB (to compare) + DFlash drafter ~2GB + compile caches.
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 100Gi
          retain: true
          globalMounts:
            - path: /models
        shm:
          type: emptyDir
          medium: Memory
          sizeLimit: 8Gi
          globalMounts:
            - path: /dev/shm
        tmp:
          type: emptyDir
          globalMounts:
            - path: /tmp

  # Strata (github.com/Niko1221/Strata): Qwen3.8-Flash-Next (125B MoE, ~6B active) with
  # experts split across VRAM / RAM / disk. OpenAI + Anthropic API at
  # http://strata.llm.svc.cluster.local:8080/v1.
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    releaseName: strata
    version: 5.2.1
    namespace: llm
    valuesFile: values-empty.yaml
    valuesInline:
      controllers:
        strata:
          strategy: Recreate
          pod:
            resourceClaims:
              - name: llm-gpu0
                resourceClaimTemplateName: llm-gpu0 # GPU 0 minus transcode's 1Gi.
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
          containers:
            app:
              # No upstream image: built sm_120-only in github.com/csobrinho/custom-images.
              # Runs as root: the entrypoint writes its config symlink into /opt/strata.
              image:
                repository: ghcr.io/csobrinho/strata
                tag: v0.1.40.1@sha256:1d242382bac3e2f5da752315a0b470e6f3a3644dead039fa0a7692dc3772f579
                pullPolicy: IfNotPresent
              # The entrypoint only forwards a few setup env vars, so merge STRATA_CONFIG_PATCH
              # (engine flags + config keys) into the saved config on every start. A REINSTALL
              # start regenerates the config after this runs: the patch lands on the next start.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  /opt/strata/.venv/bin/python - <<'EOF'
                  import glob, json, os
                  patch = json.loads(os.environ.get("STRATA_CONFIG_PATCH") or "{}")
                  for path in glob.glob("/data/config/strata-*.json"):
                      cfg = json.load(open(path))
                      args = cfg.setdefault("args", [])
                      for flag, value in patch.get("args", {}).items():
                          if flag in args[:-1]:
                              args[args.index(flag) + 1] = str(value)
                          else:
                              args += [flag, str(value)]
                      cfg.update({k: v for k, v in patch.items() if k != "args"})
                      with open(path + ".tmp", "w") as f:
                          json.dump(cfg, f, indent=1)
                      os.replace(path + ".tmp", path)
                      print(f"[patch] {path}: {json.dumps(patch)}", flush=True)
                  EOF
                  exec ./docker-entrypoint.sh
              # Read by docker-entrypoint.sh on first start (setup + ~70GB download).
              # Change any of these later with REINSTALL=1 for one start.
              env:
                TZ: America/Los_Angeles
                MODEL: IQ3_S # Q2_0 | IQ2_XS | IQ3_XXS | IQ3_S; bigger = better, more RAM.
                CONTEXT: "262144" # The model's full trained window; past it needs YaRN.
                REINSTALL: "1" # One start to apply CONTEXT; remove after.
                KV: k8v4
                VISION: "no"
                GPU: "0" # Only card visible in the pod.
                # Experts pinned in RAM. setup reads /proc/meminfo (the node's total, not
                # our limit), so pin the mode instead of trusting auto.
                LOW_RAM: "off"
                HF_HOME: /data/huggingface
                # Names Open WebUI / in-cluster clients use; without an API key, Strata
                # rejects any other Host (DNS-rebinding guard).
                STRATA_ALLOWED_HOSTS: strata.llm.svc.cluster.local,strata.llm,strata
                # - vram-reserve: keep ~1.4Gi of GPU 0 free for transcode (700 left only ~400Mi).
                # - conversation cache: Open WebUI's title/tag calls evict the chat; parking
                #   avoids re-reading up to 262K tokens.
                # - expert profile: start from the learned cache, kept on the volume.
                STRATA_CONFIG_PATCH: >-
                  {"args": {"--vram-reserve-mib": 1700, "--conversation-cache-mib": 12288,
                  "--conversation-cache-slots": 4},
                  "expert_profile_save": "/data/expert-profile-learned.bin"}
              probes:
                liveness: &probe-strata
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /health
                      port: &port-strata 8080
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 5
                readiness:
                  <<: *probe-strata
                  spec:
                    httpGet:
                      path: /health
                      port: *port-strata
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                startup:
                  <<: *probe-strata
                  spec:
                    httpGet:
                      path: /health
                      port: *port-strata
                    # First boot downloads ~70GB and builds the expert pack: allow 2h.
                    periodSeconds: 20
                    timeoutSeconds: 5
                    failureThreshold: 360
              resources:
                requests:
                  cpu: "4" # CPU experts (AVX2 on this EPYC) do real work here.
                  # Pinned arena ~53Gi + 262K KV ~2.4Gi + conversation cache 12Gi.
                  memory: 64Gi
                limits:
                  memory: 84Gi
                claims:
                  - name: llm-gpu0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
      service:
        app:
          controller: strata
          ports:
            http:
              port: *port-strata
      persistence:
        data:
          type: persistentVolumeClaim
          forceRename: strata-data
          # Re-downloadable: no kopiur backup. Model ~70GB + pack + MTP layer (~6GB).
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 200Gi
          retain: true
          globalMounts:
            - path: /data
        tmp:
          type: emptyDir
          globalMounts:
            - path: /tmp

  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    releaseName: open-webui
    version: 5.2.1
    namespace: llm
    valuesFile: values-empty.yaml
    valuesInline:
      controllers:
        open-webui:
          strategy: Recreate
          containers:
            app:
              # Runs as root: the image's /app is root-owned and it writes there at startup.
              image:
                repository: ghcr.io/open-webui/open-webui
                tag: v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
                pullPolicy: IfNotPresent
              env:
                TZ: America/Los_Angeles
                PORT: &port-webui 8080
                WEBUI_AUTH: "True"
                WEBUI_URL: https://llm.sobrinho.pt
                # Persist the generated JWT key with the data instead of /app/backend.
                WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
                ENABLE_OLLAMA_API: "False"
                ENABLE_OPENAI_API: "True"
                # vLLM; Strata. Persisted in the DB after first boot: if Strata doesn't
                # show up, add it under Admin > Settings > Connections.
                OPENAI_API_BASE_URLS: http://vllm.llm.svc.cluster.local:8000/v1;http://strata.llm.svc.cluster.local:8080/v1
                OPENAI_API_KEYS: none;none # Neither runs with an API key.
                DEFAULT_MODELS: qwen3.8-27b
                ANONYMIZED_TELEMETRY: "False"
                DO_NOT_TRACK: "True"
                SCARF_NO_ANALYTICS: "True"
              probes:
                liveness: &probe-webui
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /health
                      port: *port-webui
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 5
                readiness:
                  <<: *probe-webui
                  spec:
                    httpGet:
                      path: /health
                      port: *port-webui
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                startup:
                  <<: *probe-webui
                  spec:
                    httpGet:
                      path: /health
                      port: *port-webui
                    # First boot downloads the RAG embedding model.
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 60
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
      service:
        app:
          controller: open-webui
          ports:
            http:
              port: *port-webui
      persistence:
        data:
          existingClaim: open-webui-data
          globalMounts:
            - path: /app/backend/data

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: open-webui-kopiur
    namespace: llm
    version: 0.1.0
    valuesInline:
      persistence:
        open-webui-data:
          retain: true
          accessMode: ReadWriteOnce
          size: 5Gi
          storageClass: local-data
      backup: # Must run as root.
        mover:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          podSecurityContext:
            fsGroup: 0
      populate:
        mover:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          podSecurityContext:
            fsGroup: 0

components:
  - ../../../../components/disable-revision-history
