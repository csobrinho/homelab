# From https://github.com/trueforge-org/truecharts/blob/master/charts/library/common/values.yaml
# From https://github.com/trueforge-org/truecharts/blob/master/charts/stable/ollama/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: ollama
    repo: oci://oci.trueforge.org/truecharts
    releaseName: ollama
    namespace: llm
    version: 9.32.3
    includeCRDs: true
    valuesInline:
      TZ: America/Los_Angeles
      podOptions:
        defaultAffinity: false
      workload:
        main:
          replicas: 0 # Off for now.
          podSpec:
            containers:
              main:
                resources:
                  limits:
                    cpu: "3"
                    memory: 26Gi
                  requests:
                    cpu: 500m
                    memory: 2Gi
                env:
                  OLLAMA_FLASH_ATTENTION: "1"
                  OLLAMA_NUM_THREADS: "4"
                  OLLAMA_MAX_LOADED_MODELS: "2"
                  OLLAMA_DEBUG: "true"
            runtimeClassName: nvidia
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
        ui:
          replicas: 0 # Off for now.
          podSpec:
            containers:
              ui:
                env:
                  ENV: dev
      persistence:
        config:
          enabled: true
          retain: true
          storageClass: "ceph-block"
          accessMode: ReadWriteOnce
          size: 160Gi
        data:
          enabled: true
          retain: true
          storageClass: "ceph-block"
          accessMode: ReadWriteOnce

patches:
  # GPU claim; TrueCharts can't set resourceClaims.
  - patch: |-
      - op: add
        path: /spec/template/spec/resourceClaims
        value:
          - name: gpu
            resourceClaimTemplateName: llm-gpus # or llm-gpu0 / llm-gpu1
      - op: add
        path: /spec/template/spec/containers/0/resources/claims
        value:
          - name: gpu
    target:
      group: apps
      version: v1
      kind: Deployment
      name: ollama
