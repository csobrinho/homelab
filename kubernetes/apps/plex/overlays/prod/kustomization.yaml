# From https://github.com/trueforge-org/truecharts/blob/master/charts/library/common/values.yaml
# From https://github.com/trueforge-org/truecharts/blob/master/charts/stable/plex/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: plex
    repo: oci://oci.trueforge.org/truecharts
    releaseName: plex
    namespace: media
    version: 22.10.1
    includeCRDs: true
    valuesInline:
      TZ: America/Los_Angeles
      service:
        main:
          externalTrafficPolicy: Local
          annotations:
            external-dns.alpha.kubernetes.io/hostname: infra-plex
          labels:
            io.cilium/lb-pool: pool-infra-plex
          type: LoadBalancer
      persistence:
        config:
          existingClaim: plex-config
        media:
          enabled: true
          type: nfs
          server: infra-vm
          path: /mnt/library
          mountPath: /data
      plex:
        serverIP: 10.10.10.9 # infra-plex VIP.
        additionalAdvertiseURL: "https://plex.sobrinho.pt:443"
      containerOptions:
        NVIDIA_CAPS:
          - video
          - compute
          - utility
      scheduling:
        runtimeClass: nvidia
      podOptions:
        defaultAffinity: false
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: present
            effect: NoSchedule
      resources:
        limits:
          nvidia.com/gpu: "1"
          memory: 8Gi
        requests:
          nvidia.com/gpu: "1"
          cpu: 500m

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: plex-kopiur
    namespace: media
    version: 0.1.0
    valuesInline:
      uid: 568
      gid: 568
      persistence:
        plex-config:
          enabled: true
          retain: true
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 16Gi
