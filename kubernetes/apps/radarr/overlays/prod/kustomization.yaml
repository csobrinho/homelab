# From https://github.com/trueforge-org/truecharts/blob/master/charts/library/common/values.yaml
# From https://github.com/trueforge-org/truecharts/blob/master/charts/stable/radarr/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: radarr
    repo: oci://oci.trueforge.org/truecharts
    releaseName: radarr
    namespace: media
    version: 27.13.4
    includeCRDs: true
    valuesInline:
      TZ: America/Los_Angeles
      podOptions:
        defaultAffinity: false
      workload:
        main:
          podSpec:
            containers:
              main:
                env:
                  # Add the pod ip in the Allowed Hosts or else the probes break.
                  POD_IP: { fieldRef: { fieldPath: status.podIP } }
                  RADARR__AUTH__REQUIRED: Enabled
                  RADARR__SERVER__TRUSTEDNETWORKS: 10.42.0.0/16
                  RADARR__SERVER__ALLOWEDHOSTS: radarr.sobrinho.pt,radarr,$(POD_IP)
      resources:
        requests:
          memory: 448Mi
        limits:
          cpu: 0
      persistence:
        config:
          existingClaim: radarr-config
        data:
          enabled: true
          type: nfs
          server: infra-vm
          path: /mnt/library
          mountPath: /data
      metrics:
        main:
          enabled: true

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: radarr-kopiur
    namespace: media
    version: 0.1.0
    valuesInline:
      # yaml-language-server: $schema=https://raw.githubusercontent.com/csobrinho/helm-charts/refs/heads/main/charts/kopiur-pvc/values.schema.json
      uid: 568
      gid: 568
      persistence:
        radarr-config:
          enabled: true
          retain: true
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 5Gi

components:
  - ../../../../components/disable-revision-history
