# Wolf (games/wolf): compositor, NVENC and the games themselves. spec is immutable.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: games-gpu
  namespace: games
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
          allocationMode: ExactCount
          count: 1
          capacity:
            requests:
              memory: 4Gi
          selectors:
            - cel:
                expression: device.attributes['resource.kubernetes.io'].pciBusID == '0000:02:00.0'
