# From https://github.com/trueforge-org/truecharts/blob/master/charts/library/common/values.yaml
# From https://github.com/trueforge-org/truecharts/blob/master/charts/stable/changedetection-io/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - chrome.yaml
  - chromium.yaml
  - ingress-route.yaml

helmCharts:
  - name: changedetection-io
    repo: oci://oci.trueforge.org/truecharts
    releaseName: changedetection-io
    namespace: tools
    version: 6.8.0
    kubeVersion: "1.33"
    includeCRDs: true
    valuesInline:
      TZ: America/Los_Angeles
      persistence:
        datastore:
          enabled: true
          mountPath: /datastore
          retain: true
          accessMode: ReadWriteOnce
          size: 8Gi
          storageClass: "ceph-block"
      workload:
        main:
          podSpec:
            containers:
              main:
                env:
                  WEBDRIVER_URL: "http://chromium:3000/wd/hub"
                  PLAYWRIGHT_DRIVER_URL: "ws://chromium:3000"

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: changedetection-kopiur
    namespace: tools
    version: 0.1.0
    valuesInline:
      # yaml-language-server: $schema=https://raw.githubusercontent.com/csobrinho/helm-charts/refs/heads/main/charts/kopiur-pvc/values.schema.json
      uid: 568
      gid: 568
      backup:
        schedule:
          cron: "" # Disable the automatic backup schedule.
      persistence:
        changedetection-io-datastore:
          existingClaim: true
