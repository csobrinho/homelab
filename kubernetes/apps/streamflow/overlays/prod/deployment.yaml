apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamflow
  namespace: media
spec:
  selector:
    matchLabels:
      app: streamflow
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: streamflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      containers:
        - name: streamflow
          image: ghcr.io/krinkuto11/streamflow:2.7.1@sha256:e8ad3888af5347f00a9ec9ac4efaf9a60506aec1a03276471b0c99498dcd7552
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              memory: 256Mi
          ports:
            - name: main
              containerPort: 5000
          env:
            - name: TZ
              value: America/Los_Angeles
          volumeMounts:
            - mountPath: /app/data
              name: data
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: streamflow-data
        - name: tmp
          emptyDir: {}
