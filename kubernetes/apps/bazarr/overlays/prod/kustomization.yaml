# From https://github.com/trueforge-org/truecharts/blob/master/charts/library/common/values.yaml
# From https://github.com/trueforge-org/truecharts/blob/master/charts/stable/bazarr/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: bazarr
    repo: oci://oci.trueforge.org/truecharts
    releaseName: bazarr
    namespace: media
    version: 24.8.1
    includeCRDs: true
    valuesInline:
      TZ: America/Los_Angeles
      persistence:
        config:
          existingClaim: bazarr-config
        data:
          enabled: true
          type: nfs
          server: infra-vm
          path: /mnt/library
          mountPath: /data
      resources:
        limits:
          memory: 450Mi
        requests:
          cpu: 50m

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: bazarr-kopiur
    namespace: media
    version: 0.1.0
    valuesInline:
      # yaml-language-server: $schema=https://raw.githubusercontent.com/csobrinho/helm-charts/refs/heads/main/charts/kopiur-pvc/values.schema.json
      uid: 568
      gid: 568
      backup:
        schedule:
          cron: "" # Disable the automatic backup schedule.
      persistence:
        bazarr-config:
          enabled: true
          retain: true
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 1Gi
