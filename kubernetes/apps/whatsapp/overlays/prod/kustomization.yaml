# From https://github.com/trueforge-org/truecharts/blob/master/charts/library/common/values.yaml
# From https://github.com/trueforge-org/truecharts/blob/master/charts/stable/whatsapp/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - deployment.yaml
  - ingress-route.yaml
  - service.yaml
  - secrets/whatsapp-secret-enc.yaml

helmCharts:
  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: whatsapp-kopiur
    namespace: tools
    version: 0.1.0
    valuesInline:
      uid: 568
      gid: 568
      persistence:
        whatsapp-sessions:
          enabled: true
          retain: true
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 256Mi
        whatsapp-media:
          enabled: true
          retain: true
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 256Mi

components:
  - ../../../../components/disable-revision-history
