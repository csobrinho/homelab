---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: s3
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-secret
          namespace: kopiur-system
      bucket: kopiur
      prefix: "" # bucket root, maximum dedup
      endpoint: s3.sobrinho.pt
      region: us-east-1
  encryption:
    passwordSecretRef:
      name: kopiur-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  scheduleDefaults:
    timezone: America/Los_Angeles
