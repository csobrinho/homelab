# From https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/explorer/
# From https://games-on-whales.github.io/wolf/stable/user/quickstart.html
# yaml-language-server: $schema=../../../../fixes/kustomization.schema.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - fenrir/app-es-de.yaml
  - fenrir/ingress-route.yaml
  - fenrir/user-admin.yaml
  - secrets/direwolf-pin-proxy-secret-enc.yaml

# Wolf's apps, one file each (order = name). A change restarts wolf.
configMapGenerator:
  - name: wolf-config
    namespace: games
    files:
      - wolf/00-profiles.toml
      - wolf/10-es-de.toml

# Wolf streams on-demand virtual desktops to Moonlight clients. Each app (Steam, ES-DE,
# RetroArch, ...) is a container Wolf starts through a Docker API, so the pod carries its
# own dockerd (dind sidecar); Talos has no Docker socket to borrow.
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    releaseName: wolf
    version: 5.2.1
    namespace: games
    valuesFile: values-empty.yaml
    valuesInline:
      controllers:
        app:
          strategy: Recreate
          initContainers:
            # The only container that references the claim, so only it gets the claimed
            # /dev/nvidiaN injected; it records that GPU's PCI bus ID for wolf.
            gpu-select:
              image:
                repository: busybox
                tag: "1.38"
                pullPolicy: IfNotPresent
              command: ["sh", "-ec"]
              args:
                - |
                  set -- /dev/nvidia[0-9]*
                  if [ "$#" -ne 1 ] || [ ! -c "$1" ]; then
                    echo "gpu-select: expected exactly one GPU from the claim, got: $*" >&2
                    exit 1
                  fi
                  minor=${1#/dev/nvidia}
                  for info in /proc/driver/nvidia/gpus/*/information; do
                    if [ "$(awk -F: '/^Device Minor/ {gsub(/[ \t]/, "", $2); print $2}' "$info")" = "$minor" ]; then
                      pci=$(basename "$(dirname "$info")")
                      echo "gpu-select: $1 -> $pci"
                      echo "$pci" >/run/gpu/pci
                      exit 0
                    fi
                  done
                  echo "gpu-select: no /proc/driver/nvidia entry for $1" >&2
                  exit 1
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
                claims:
                  - name: games-gpu
            # Copies the userspace driver (incl. the 32-bit libs Steam needs) into /etc/wolf,
            # where wolf and every app container mount it from. Tagged by Talos release, so
            # Renovate bumps it in the Talos PR; the check below holds the pod until the node
            # runs the matching driver.
            nvidia-driver:
              dependsOn: gpu-select
              image:
                repository: ghcr.io/csobrinho/wolf-nvidia-driver
                # Keep in sync with talos/versions.yaml (.version.talos).
                tag: v1.14.2@sha256:9255e14551dca8f017404f1526833b38ea32bcbbebf4064f81197cb7762a95df
                pullPolicy: IfNotPresent
              command: ["sh", "-ec"]
              args:
                - |
                  node=$(cat /sys/module/nvidia/version)
                  set -- /usr/nvidia/lib/libnvidia-*.so."$node"
                  if [ ! -e "$1" ]; then
                    echo "nvidia-driver: the node runs driver $node, this image doesn't: tag it with the node's Talos release" >&2
                    exit 1
                  fi
                  dst=/etc/wolf/nvidia-driver
                  if [ "$(cat "$dst/.version" 2>/dev/null || true)" != "$node" ]; then
                    rm -rf "$dst.new"
                    mkdir -p "$dst.new/share/vulkan/icd.d"
                    cp -a /usr/nvidia/. "$dst.new/"
                    cp /etc/vulkan/icd.d/nvidia_icd.json "$dst.new/share/vulkan/icd.d/"
                    echo "$node" >"$dst.new/.version"
                    rm -rf "$dst"
                    mv "$dst.new" "$dst"
                  fi
                  # The image's ld.so.conf entry for lib/ is broken (dash's echo -e), so its
                  # soname links (libnvidia-egl-wayland.so.1, ...) were never made; wolf and
                  # the apps mount the copy read-only and can't make them either.
                  ldconfig -n "$dst/lib" "$dst/lib32"
                  echo "nvidia-driver: $node ready"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
            # config.toml = what Wolf wrote before its profiles (paired_clients, ...) + wolf/*.toml.
            wolf-config:
              dependsOn: nvidia-driver
              image:
                repository: busybox
                tag: "1.38"
                pullPolicy: IfNotPresent
              command: ["sh", "-ec"]
              args:
                - |
                  cfg=/etc/wolf/cfg/config.toml
                  awk '/^\[\[profiles\]\]/ { exit } { print }' "$cfg" >"$cfg.new"
                  cat /config/*.toml >>"$cfg.new" # Name order; each file must end in a newline.
                  mv "$cfg.new" "$cfg"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
            # Native sidecar: up (and answering) before wolf, stopped after it. App
            # containers live in this container's cgroup, so games count against it.
            dind:
              dependsOn: wolf-config
              image:
                repository: docker
                tag: 29.9.0-dind
                pullPolicy: IfNotPresent
              restartPolicy: Always
              args:
                - --host=unix:///var/run/dind/docker.sock
              env:
                DOCKER_TLS_CERTDIR: "" # Unix socket only: no TCP listener, no TLS.
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    exec:
                      command: ["docker", "-H", "unix:///var/run/dind/docker.sock", "info"]
                    periodSeconds: 2
                    failureThreshold: 90
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                # No limits: this cgroup holds the games themselves.
              securityContext:
                privileged: true
              # /dev is the host's: keep kubelet's termination-log file off it.
              terminationMessagePath: /tmp/termination-log
          containers:
            app:
              image:
                repository: ghcr.io/games-on-whales/wolf
                tag: stable@sha256:b0ef253739f9bd49b71eba7e150c955fd05990c0d409e666d89236995351551a
                pullPolicy: IfNotPresent
              command: ["/bin/bash", "-ec"]
              args:
                - |
                  # renderD numbering isn't stable across reboots; the PCI bus ID is.
                  pci=$(cat /run/gpu/pci)
                  set -- /sys/bus/pci/devices/"${pci}"/drm/renderD*
                  node=$(basename "$1")
                  if [ ! -c "/dev/dri/${node}" ]; then
                    echo "wolf: no render node for ${pci} (got '${node}')" >&2
                    exit 1
                  fi
                  export WOLF_RENDER_NODE="/dev/dri/${node}"
                  echo "wolf: ${pci} -> ${WOLF_RENDER_NODE}"
                  # /dev is the host's, and Talos has no /dev/fd: point supervisord's log
                  # targets at what /dev/fd links to.
                  sed -i 's#/dev/fd/#/proc/self/fd/#g' /etc/supervisord.conf
                  exec /entrypoint.sh
              env:
                TZ: America/Los_Angeles
                CUDA_DEVICE_ORDER: PCI_BUS_ID # Wolf maps the render node to a CUDA index in PCI order.
                # Wolf keeps its CUDA context after the first stream; without this, the card
                # stays at boost clocks while idle.
                CUDA_DISABLE_PERF_BOOST: "1"
                WOLF_DOCKER_SOCKET: /var/run/dind/docker.sock
                # Wolf can't find its own container in dind (it logs "automatic mounts
                # matching is disabled"), so these paths are used as-is: keep them equal.
                HOST_APPS_STATE_FOLDER: /etc/wolf
                XDG_RUNTIME_DIR: /var/run/wolf
                # An absolute path, so dockerd bind-mounts the driver copy into each app.
                NVIDIA_DRIVER_VOLUME_NAME: /etc/wolf/nvidia-driver
                WOLF_STOP_CONTAINER_ON_EXIT: "TRUE"
                WOLF_LOG_LEVEL: INFO
              probes:
                liveness: &probe
                  enabled: true
                  type: TCP
                  port: 47989
                readiness:
                  <<: *probe
                startup:
                  <<: *probe
                  spec:
                    failureThreshold: 30
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
              securityContext:
                privileged: true # uinput/uhid + hotplugged devices under host /dev.
              terminationMessagePath: /tmp/termination-log # /dev is the host's.
      defaultPodOptions:
        automountServiceAccountToken: false
        enableServiceLinks: false
        terminationGracePeriodSeconds: 60
        nodeSelector:
          nvidia.com/gpu.present: "true"
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: present
            effect: NoSchedule
        resourceClaims:
          - name: games-gpu
            resourceClaimName: games-gpu
      service:
        app:
          primary: true
          type: LoadBalancer
          externalTrafficPolicy: Local
          annotations:
            external-dns.kubernetes.io/hostname: infra-games
          labels:
            io.cilium/lb-pool: pool-infra-games
          # Moonlight: add the host by its DNS name; mDNS discovery doesn't cross the LB.
          ports:
            https:
              port: 47984
              protocol: TCP
            http:
              port: 47989
              protocol: TCP
            rtsp:
              port: 48010
              protocol: TCP
            control:
              port: 47999
              protocol: UDP
            video:
              port: 48100
              protocol: UDP
            audio:
              port: 48200
              protocol: UDP
      # Paths Wolf hands to dockerd as bind sources must exist at the same path in wolf
      # and dind: /etc/wolf, /var/run/wolf (Wayland, PulseAudio, wolf.sock), /dev, /run/udev.
      persistence:
        wolf-state:
          existingClaim: wolf-state
          globalMounts:
            - path: /etc/wolf
          # Only wolf: nvidia-driver copies the driver out of its own /usr/nvidia.
          advancedMounts:
            app:
              app:
                - path: /usr/nvidia
                  subPath: nvidia-driver
                  readOnly: true
        wolf-config:
          type: configMap
          name: wolf-config
          globalMounts:
            - path: /config
              readOnly: true
        # dind's /var/lib/docker: re-pullable app images, so no kopiur backup.
        wolf-docker:
          type: persistentVolumeClaim
          forceRename: wolf-docker
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 64Gi
          retain: true
          globalMounts:
            - path: /var/lib/docker
        gpu:
          type: emptyDir
          globalMounts:
            - path: /run/gpu
        dind-socket:
          type: emptyDir
          globalMounts:
            - path: /var/run/dind
        # The pod's /dev/shm is 64Mi, which apps (IpcMode host) share; PCSX2 maps the PS2's
        # memory there and dies with SIGBUS.
        shm:
          type: emptyDir
          medium: Memory
          sizeLimit: 2Gi
          globalMounts:
            - path: /dev/shm
        # Not under /tmp: the dind entrypoint mounts a tmpfs over /tmp, hiding it from dockerd.
        sockets:
          type: emptyDir
          globalMounts:
            - path: /var/run/wolf
        # Not in gpu-select: it must see only the claimed GPU's /dev/nvidiaN.
        dev:
          type: hostPath
          hostPath: /dev
          hostPathType: Directory
          advancedMounts:
            app:
              dind:
                - path: /dev
              app:
                - path: /dev
        udev:
          type: hostPath
          hostPath: /run/udev
          hostPathType: DirectoryOrCreate
          globalMounts:
            - path: /run/udev
        # Apps see it once their wolf/*.toml mounts it, e.g. "/roms:/ROMs" for ES-DE.
        roms:
          type: nfs
          server: infra-vm
          path: /mnt/library/roms
          globalMounts:
            - path: /roms

  # Fenrir (xerktech fork): one pod per Moonlight session (Wolf + the app, no dind) on the
  # session node's host network; Moonlight pairs with that node's IP.
  - name: direwolf-operator
    repo: oci://ghcr.io/xerktech/charts
    releaseName: direwolf
    version: 0.0.1-38344847042-SNAPSHOT
    namespace: games
    includeCRDs: true
    valuesInline:
      controllers:
        direwolf_operator:
          containers:
            operator:
              args:
                - --session-node-selector=kubernetes.io/hostname=infra4
                - --session-tolerations=nvidia.com/gpu=present:NoSchedule
                - --session-port-range=20000-20999
              env:
                WOLF_IMAGE: ghcr.io/games-on-whales/wolf:stable@sha256:b0ef253739f9bd49b71eba7e150c955fd05990c0d409e666d89236995351551a
        moonlight_proxy:
          pod:
            nodeSelector:
              kubernetes.io/hostname: infra4
          containers:
            proxy:
              args:
                - --tls-cert=/etc/certs/tls.crt
                - --tls-key=/etc/certs/tls.key
                - --max-concurrent-sessions=1
                # Pairing page: only Traefik (pod or node source) with the proxy secret.
                - --pin-port=47990
                - --pin-trusted-proxies=10.42.0.0/16,10.10.2.0/24
                - --pin-proxy-secret-file=/etc/pin/secret
                - --pin-user-header=X-Direwolf-User
      service:
        pin:
          controller: moonlight_proxy
          ports:
            http:
              port: 47990
      persistence:
        pin-proxy:
          type: secret
          name: direwolf-pin-proxy
          advancedMounts:
            moonlight_proxy:
              proxy:
                - path: /etc/pin
                  readOnly: true

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: wolf-kopiur
    namespace: games
    version: 0.1.0
    valuesInline:
      persistence:
        # /etc/wolf: config.toml + pairing certs, per-profile app homes (saves,
        # emulator config, Steam), and the NVIDIA driver copy.
        wolf-state:
          retain: true
          accessMode: ReadWriteOnce
          size: 50Gi
          storageClass: local-data
      backup: # Must run as root: Wolf writes as root, apps as 1000.
        extraSpec:
          files:
            # Re-downloadable: game installs, shader caches, the driver copy.
            ignoreRules:
              - /lost+found
              - /nvidia-driver/
              - "**/steamapps/common/"
              - "**/steamapps/downloading/"
              - "**/steamapps/shadercache/"
              - "**/.cache/"
        mover:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          podSecurityContext:
            fsGroup: 0
      populate:
        mover:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          podSecurityContext:
            fsGroup: 0

components:
  - ../../../../components/disable-revision-history
