apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-db
provisioner: csi.proxmox.sinextra.dev
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  csi.storage.k8s.io/fstype: ext4
  storage: local-db # zvols on the db pool (sync=standard, recordsize=16K)
  ssd: "true" # 990 PRO → SSD emulation + discard to the pool
  cache: none # ZFS ARC already caches; avoids double-buffering + host-crash risk
  aio: native # pairs with cache=none/directsync on ZFS
mountOptions:
  - noatime
