# From https://github.com/grafana/grafana-operator/blob/master/deploy/helm/grafana-operator/values.yaml
# Based on: https://github.com/onedr0p/home-ops/blob/main/kubernetes/apps/o11y/grafana-operator/instance/grafana.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - grafana-dashboard.yaml
  - grafana-datasource.yaml
  - grafana.yaml
  - ingress-route.yaml
  - mutating-admission-policy-binding.yaml
  - secrets/grafana-admin-password-secret-enc.yaml

helmCharts:
  - name: grafana-operator
    repo: oci://ghcr.io/grafana/helm-charts
    releaseName: grafana-operator
    namespace: o11y
    version: 5.25.0
    includeCRDs: true
    valuesInline:
      dashboard:
        enabled: true
      serviceMonitor:
        enabled: true

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: grafana-kopiur
    namespace: o11y
    version: 0.1.0
    valuesInline:
      # yaml-language-server: $schema=https://raw.githubusercontent.com/csobrinho/helm-charts/refs/heads/main/charts/kopiur-pvc/values.schema.json
      uid: 1000
      gid: 1000
      persistence:
        grafana-data:
          enabled: true
          retain: true
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 5Gi
