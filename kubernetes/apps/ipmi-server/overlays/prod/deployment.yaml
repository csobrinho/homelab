apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipmi-server
  namespace: tools
spec:
  selector:
    matchLabels:
      app: ipmi-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ipmi-server
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
        feature.node.kubernetes.io/usb-zigbee.present: "true"
      containers:
        - name: ipmi-server
          image: mneveroff/ipmi-server:1.2.7
          resources:
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 80
              name: main
              protocol: TCP
          env:
            - name: TZ
              value: America/Los_Angeles
      restartPolicy: Always
