# From https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/explorer/
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    releaseName: music-assistant
    version: 5.3.0
    namespace: media
    valuesFile: values-empty.yaml
    valuesInline:
      controllers:
        music-assistant:
          strategy: Recreate
          pod:
            # Player discovery (mDNS, AirPlay, Chromecast, Sonos, Squeezebox) and streams.
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            securityContext:
              runAsNonRoot: true
              runAsUser: &uid 568
              runAsGroup: *uid
              fsGroup: *uid
              fsGroupChangePolicy: OnRootMismatch
              supplementalGroups: [*uid]
              seccompProfile:
                type: RuntimeDefault
          containers:
            app:
              image:
                repository: ghcr.io/music-assistant/server
                tag: 2.10.13@sha256:7510aaa7ee5fc85b34fd0de17992bd14473895b23ce3eb9b310092743f4dbb84
                pullPolicy: IfNotPresent
              env:
                TZ: America/Los_Angeles
                # uid 568 has no home, so yt-dlp would cache under /.cache.
                XDG_CACHE_HOME: /tmp/cache
              probes:
                liveness: &probe
                  enabled: true
                  custom: true
                  spec:
                    # Served once the core controllers are up; unauthenticated.
                    httpGet: &probe-http
                      path: /info
                      port: &port 8095
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 5
                readiness:
                  <<: *probe
                  spec:
                    httpGet: *probe-http
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                startup:
                  <<: *probe
                  spec:
                    httpGet: *probe-http
                    periodSeconds: 5
                    timeoutSeconds: 5
                    failureThreshold: 60
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
        # YouTube PO token provider for yt-dlp; MA reaches it via the bgutil service.
        bgutil:
          strategy: Recreate
          pod:
            securityContext:
              runAsNonRoot: true
              runAsUser: *uid
              runAsGroup: *uid
              seccompProfile:
                type: RuntimeDefault
          containers:
            app:
              image:
                repository: brainicism/bgutil-ytdlp-pot-provider
                tag: 2.0.2-node@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
                pullPolicy: IfNotPresent
              probes:
                liveness: &bgutil-probe
                  enabled: true
                  custom: true
                  spec:
                    httpGet: &bgutil-probe-http
                      path: /ping
                      port: &bgutil-port 4416
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 5
                readiness:
                  <<: *bgutil-probe
                  spec:
                    httpGet: *bgutil-probe-http
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
      service:
        app:
          controller: music-assistant
          ports:
            http:
              port: *port
        bgutil:
          controller: bgutil
          ports:
            http:
              port: *bgutil-port
      persistence:
        data:
          existingClaim: music-assistant-data
          advancedMounts:
            music-assistant:
              app:
                - path: /data
        library:
          type: nfs
          server: infra-vm
          path: /mnt/library/media/music
          advancedMounts:
            music-assistant:
              app:
                - path: /music
                  readOnly: true
        cache:
          type: emptyDir
          advancedMounts:
            music-assistant:
              app:
                - path: /tmp/cache

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: music-assistant-kopiur
    namespace: media
    version: 0.1.0
    valuesInline:
      uid: 568
      gid: 568
      persistence:
        music-assistant-data:
          retain: true
          accessMode: ReadWriteOnce
          size: 5Gi
          storageClass: local-data

components:
  - ../../../../components/disable-revision-history
