# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonAnnotations:
  # CRDs ship in the same sync; the validating webhook (failurePolicy: Fail) must be up first.
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  argocd.argoproj.io/sync-wave: "1"

resources:
  - kubernetesupgrade.yaml
  - talosupgrade.yaml
