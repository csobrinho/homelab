---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
  annotations:
    # CRDs ship in the same sync; the validating webhook (failurePolicy: Fail) must be up first.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  talos:
    # Keep in sync with talos/versions.yaml (.version.talos).
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos versioning=semver
    version: v1.14.7
  policy:
    rebootMode: powercycle
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        status.phase != 'Running'
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !(status.phase in ['Resolving', 'Restoring'])
    # Wait for the shared CNPG cluster to be whole again before the next node.
    # Its instances sit on node-pinned local-db zvols, so each reboot takes one
    # offline until it is back and has replayed WAL from the primary.
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: cluster
      namespace: cnpg-system
      description: cnpg-system/cluster has all instances ready
      expr: |-
        has(status.readyInstances) && status.readyInstances == object.spec.instances &&
        has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
