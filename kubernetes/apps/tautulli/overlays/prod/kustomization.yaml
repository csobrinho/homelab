# From https://github.com/trueforge-org/truecharts/blob/master/charts/library/common/values.yaml
# From https://github.com/trueforge-org/truecharts/blob/master/charts/stable/tautulli/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: tautulli
    repo: oci://oci.trueforge.org/truecharts
    releaseName: tautulli
    namespace: media
    version: 22.8.0
    includeCRDs: true
    valuesInline:
      TZ: America/Los_Angeles
      persistence:
        config:
          existingClaim: tautulli-config

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: tautulli-kopiur
    namespace: media
    version: 0.1.0
    valuesInline:
      # yaml-language-server: $schema=https://raw.githubusercontent.com/csobrinho/helm-charts/refs/heads/main/charts/kopiur-pvc/values.schema.json
      uid: 568
      gid: 568
      persistence:
        tautulli-config:
          enabled: true
          retain: true
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 512Mi
