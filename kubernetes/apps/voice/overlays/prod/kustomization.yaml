# HA Assist voice: Wyoming STT/TTS and the EchoMuse satellite controller.
# From https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/explorer/
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  # Wyoming STT for HA Assist: tcp://whisper.home-assistant.svc.cluster.local:10300.
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    releaseName: whisper
    version: 5.3.0
    namespace: home-assistant
    valuesFile: values-empty.yaml
    valuesInline:
      controllers:
        whisper:
          strategy: Recreate
          pod:
            securityContext:
              runAsNonRoot: true
              runAsUser: &uid-voice 568
              runAsGroup: *uid-voice
              fsGroup: *uid-voice
              fsGroupChangePolicy: OnRootMismatch
              supplementalGroups: [*uid-voice]
              seccompProfile:
                type: RuntimeDefault
            resourceClaims:
              - name: whisper-gpu
                resourceClaimTemplateName: whisper-gpu
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
          containers:
            app:
              image:
                repository: ghcr.io/linuxserver/faster-whisper
                tag: gpu-v3.8.1-ls75@sha256:526ee69010caf82e44b6977818104b678e54cceb131b50399cc0458cbbca6fd3
                pullPolicy: IfNotPresent
              # Upstream's s6 run script minus s6 (needs root), so it runs as 568 read-only.
              command:
                - bash
                - -c
                - |
                  export LD_LIBRARY_PATH=$(python3 -c 'import os, nvidia.cublas.lib, nvidia.cudnn.lib; print(os.path.dirname(nvidia.cublas.lib.__path__[0]) + "/lib:" + os.path.dirname(nvidia.cudnn.lib.__path__[0]) + "/lib")')
                  exec python3 -m wyoming_faster_whisper \
                    --uri tcp://0.0.0.0:10300 \
                    --device cuda \
                    --model distil-large-v3.5 \
                    --language en \
                    --data-dir /config \
                    --download-dir /config
              env:
                TZ: America/Los_Angeles
                TMPDIR: /tmp
              probes:
                liveness: &probe-whisper
                  enabled: true
                  type: TCP
                  port: &port-whisper 10300
                readiness:
                  <<: *probe-whisper
                startup:
                  <<: *probe-whisper
                  spec:
                    # First boot downloads the model (~1.5GB).
                    periodSeconds: 10
                    failureThreshold: 60
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  memory: 4Gi
                claims:
                  - name: whisper-gpu
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
      service:
        app:
          controller: whisper
          ports:
            wyoming:
              port: *port-whisper
      persistence:
        models:
          type: persistentVolumeClaim
          forceRename: whisper-models
          # Re-downloadable: no kopiur backup.
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 5Gi
          retain: true
          globalMounts:
            - path: /config
        tmp:
          type: emptyDir
          globalMounts:
            - path: /tmp

  # Wyoming TTS for HA Assist: tcp://piper.home-assistant.svc.cluster.local:10200. CPU only.
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    releaseName: piper
    version: 5.3.0
    namespace: home-assistant
    valuesFile: values-empty.yaml
    valuesInline:
      controllers:
        piper:
          strategy: Recreate
          pod:
            securityContext:
              runAsNonRoot: true
              runAsUser: *uid-voice
              runAsGroup: *uid-voice
              fsGroup: *uid-voice
              fsGroupChangePolicy: OnRootMismatch
              supplementalGroups: [*uid-voice]
              seccompProfile:
                type: RuntimeDefault
          containers:
            app:
              image:
                repository: rhasspy/wyoming-piper
                tag: 2.5.4@sha256:333622ab9e4bcd00c80a37219b90a1a9d6aa3fd1ad34e0a6e3bddd36ee999efd
                pullPolicy: IfNotPresent
              # Default voice; others picked in HA are downloaded on demand into /data.
              args:
                - --voice
                - en_US-lessac-medium
              env:
                TZ: America/Los_Angeles
              probes:
                liveness: &probe-piper
                  enabled: true
                  type: TCP
                  port: &port-piper 10200
                readiness:
                  <<: *probe-piper
                startup:
                  <<: *probe-piper
                  spec:
                    periodSeconds: 5
                    failureThreshold: 60
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
      service:
        app:
          controller: piper
          ports:
            wyoming:
              port: *port-piper
      persistence:
        data:
          type: persistentVolumeClaim
          forceRename: piper-data
          # Re-downloadable voices: no kopiur backup.
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 2Gi
          retain: true
          globalMounts:
            - path: /data
        tmp:
          type: emptyDir
          globalMounts:
            - path: /tmp

  # EchoMuse (github.com/wilbowes/EchoMuse): rooted Echo Dots as HA Assist satellites.
  # From https://github.com/wilbowes/EchoMuse/blob/2d59645ab514e69ed07eaa864f9ed0b490f9ca75/controller/docker-compose.deploy.yml
  # Add each Dot in HA as ESPHome at <node IP>:<device port> (16001+, shown on the dashboard).
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    releaseName: echomuse
    version: 5.3.0
    namespace: home-assistant
    valuesFile: values-empty.yaml
    valuesInline:
      controllers:
        echomuse:
          strategy: Recreate
          pod:
            # mDNS advertising + one ESPHome port per device; no port mapping.
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
          containers:
            app:
              # Runs as root, like upstream's compose.
              image:
                repository: ghcr.io/wilbowes/echomuse-controller
                tag: 2.27.1@sha256:10fb1e32cbc763dac75280e57d66c7124ada36b2a41e189025560ce19a84f6b3
                pullPolicy: IfNotPresent
              env:
                TZ: America/Los_Angeles
                SERVER_HOST: 0.0.0.0
                SERVER_PORT: "8767"
                SERVER_TLS_PORT: "8770"
                REQUIRE_DEVICE_TLS: "0" # 1 once every device shows "wss (TLS)".
                API_PORT: "8768"
                SERVER_IP: "" # Detected from the node's routing table.
                MDNS_NAME: echomuse
                ESPHOME_PROJECT_VERSION: 2.27.0
                EM_ESPHOME_PORT_BASE: "16001"
                OWW_MODEL: hey_jarvis
                OWW_THRESHOLD: "0.5"
                DB_PATH: /app/data/echomuse.db
                DEVICE_APPROVAL: strict
                DEBUG: "0"
              probes:
                liveness: &probe-echomuse
                  enabled: true
                  type: TCP
                  port: 8768
                readiness:
                  <<: *probe-echomuse
                startup:
                  <<: *probe-echomuse
                  spec:
                    periodSeconds: 5
                    failureThreshold: 60
              resources:
                requests:
                  cpu: 100m # Wake word inference on CPU.
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
      service:
        app:
          controller: echomuse
          ports:
            http:
              port: 8768
      persistence:
        data:
          type: persistentVolumeClaim
          forceRename: echomuse-data
          # DB + device CA (losing it means re-pairing every Dot).
          storageClass: local-data
          accessMode: ReadWriteOnce
          size: 1Gi
          retain: true
          globalMounts:
            - path: /app/data

components:
  - ../../../../components/disable-revision-history
