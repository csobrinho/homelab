apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-explorer
  namespace: tools
spec:
  selector:
    matchLabels:
      app: mqtt-explorer
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mqtt-explorer
    spec:
      containers:
        - name: mqtt-explorer
          image: smeagolworms4/mqtt-explorer:latest@sha256:8c8a92b9727af767d840f484e22499e852203f2987f750ad384c3fc630c8b80b
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
            limits:
              memory: 512Mi
          ports:
            - containerPort: 4000
          env:
            - name: TZ
              value: America/Los_Angeles
          volumeMounts:
            - mountPath: /mqtt-explorer/config
              name: config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: mqtt-explorer-config
