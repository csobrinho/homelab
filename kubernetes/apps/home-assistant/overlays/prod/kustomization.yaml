# From https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/explorer/
# yaml-language-server: $schema=../../../../fixes/kustomization.schema.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    releaseName: home-assistant
    version: 5.3.0
    namespace: home-assistant
    valuesFile: values-empty.yaml
    valuesInline:
      controllers:
        app:
          strategy: Recreate
          containers:
            app:
              image: &ha-image
                repository: ghcr.io/home-operations/home-assistant
                tag: 2026.10.2@sha256:0d289f21951f9ecf0bf8888089c6d43f379611c47fe84f13d3302e83daa3c8fa
                pullPolicy: IfNotPresent
              env:
                TZ: America/Los_Angeles
              probes:
                liveness: &probe
                  enabled: true
                  type: TCP
                  port: &port 8123
                readiness:
                  <<: *probe
                startup:
                  <<: *probe
                  spec:
                    periodSeconds: 5
                    failureThreshold: 60
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
            codeserver:
              image:
                repository: ghcr.io/coder/code-server
                tag: 4.141.0@sha256:72ab24b5680ee597dd647b30d82625752f40109b5f61bef90ffbf1ea1f02dbb8
                pullPolicy: IfNotPresent
              args:
                - --auth
                - none
                - --user-data-dir
                - /config/.vscode
                - --extensions-dir
                - /config/.vscode
                - --port
                - "12321"
                - /config
              env:
                HOME: /tmp # The image's home (/home/coder) isn't writable as 568.
              probes:
                liveness: &probe-cs
                  enabled: true
                  type: TCP
                  port: &port-cs 12321
                readiness:
                  <<: *probe-cs
              resources:
                requests:
                  cpu: 10m
                  memory: 512Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          initContainers:
            # pylutron-caseta 0.29.0 on Python 3.14.8 builds a check_hostname=True TLS context
            # but connects with server_hostname="", which now raises "check_hostname requires
            # server_hostname" (gurumitts/pylutron-caseta#217). Copy the image's own
            # smartbridge.py, add check_hostname = False (the bridge cert is still verified
            # against its CA), and mount it over the original. Drop this once a fix ships.
            patch-lutron:
              image: *ha-image
              command: ["python3", "-I", "-c"]
              args:
                - |
                  import importlib.util, pathlib, sys
                  target, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
                  src = pathlib.Path(importlib.util.find_spec("pylutron_caseta").origin).parent / "smartbridge.py"
                  if src != target:
                      print(f"WARNING: smartbridge.py is at {src} but the mount targets {target}", file=sys.stderr)
                  code = src.read_text()
                  anchor = "        ssl_context.verify_mode = ssl.CERT_REQUIRED\n"
                  if "check_hostname" in code:
                      print("upstream already sets check_hostname; mounting the original unchanged")
                  elif code.count(anchor) != 1:
                      print("WARNING: patch anchor not found; mounting the original unchanged", file=sys.stderr)
                  else:
                      code = code.replace(anchor, anchor + "        ssl_context.check_hostname = False\n")
                      print(f"patched {src}")
                  out.write_text(code)
                - &smartbridge /usr/local/lib/python3.14/site-packages/pylutron_caseta/smartbridge.py
                - /patch/smartbridge.py
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
      defaultPodOptions:
        automountServiceAccountToken: false
        enableServiceLinks: false
        # Host network for discovery (mDNS/SSDP/HomeKit, ESPHome BT proxies).
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        securityContext:
          runAsNonRoot: true
          runAsUser: &uid 568
          runAsGroup: *uid
          fsGroup: *uid
          fsGroupChangePolicy: OnRootMismatch
          supplementalGroups: [*uid]
          seccompProfile:
            type: RuntimeDefault
      service:
        app:
          forceRename: home-assistant
          primary: true
          type: LoadBalancer
          annotations:
            external-dns.kubernetes.io/hostname: infra-home-assistant
          labels:
            io.cilium/lb-pool: pool-infra-home-assistant
          ports:
            http:
              port: *port
        codeserver:
          controller: app
          ports:
            codeserver:
              port: *port-cs
      persistence:
        config:
          existingClaim: home-assistant-data
          globalMounts:
            - path: /config
        tmp:
          type: emptyDir
          globalMounts:
            - path: /tmp
        lutron-patch:
          type: emptyDir
          sizeLimit: 1Mi
          advancedMounts:
            app:
              patch-lutron:
                - path: /patch
              app:
                - path: *smartbridge
                  subPath: smartbridge.py
                  readOnly: true

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: home-assistant-kopiur
    namespace: home-assistant
    version: 0.1.0
    valuesInline:
      uid: 568
      gid: 568
      persistence:
        home-assistant-data:
          retain: true
          accessMode: ReadWriteOnce
          size: 20Gi
          storageClass: local-db

components:
  - ../../../../components/disable-revision-history
