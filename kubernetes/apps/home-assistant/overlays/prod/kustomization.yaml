# From https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/explorer/
# yaml-language-server: $schema=../../../../fixes/kustomization.schema.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

configMapGenerator:
  - name: home-assistant-fixes
    namespace: home-assistant
    files:
      - fixes/smartbridge.py

helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    releaseName: home-assistant
    version: 5.3.0
    namespace: home-assistant
    valuesFile: values-empty.yaml
    valuesInline:
      controllers:
        app:
          strategy: Recreate
          containers:
            app:
              image:
                repository: ghcr.io/home-operations/home-assistant
                tag: 2026.10.2@sha256:a582f4b113e3018517a5ae9727b873e262aa787fa97f07b97b71bfc57f14d470
                pullPolicy: IfNotPresent
              env:
                TZ: America/Los_Angeles
              probes:
                liveness: &probe
                  enabled: true
                  type: TCP
                  port: &port 8123
                readiness:
                  <<: *probe
                startup:
                  <<: *probe
                  spec:
                    periodSeconds: 5
                    failureThreshold: 60
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
            codeserver:
              image:
                repository: ghcr.io/coder/code-server
                tag: 4.143.1@sha256:377b66bec5645510ed52549bb00e648c273edc604d230a3f90fd2b2433afcb97
                pullPolicy: IfNotPresent
              args:
                - --auth
                - none
                - --user-data-dir
                - /config/.vscode
                - --extensions-dir
                - /config/.vscode
                - --port
                - "12321"
                - /config
              env:
                HOME: /tmp # The image's home (/home/coder) isn't writable as 568.
              probes:
                liveness: &probe-cs
                  enabled: true
                  type: TCP
                  port: &port-cs 12321
                readiness:
                  <<: *probe-cs
              resources:
                requests:
                  cpu: 10m
                  memory: 512Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
      defaultPodOptions:
        automountServiceAccountToken: false
        enableServiceLinks: false
        # Host network for discovery (mDNS/SSDP/HomeKit, ESPHome BT proxies).
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        securityContext:
          runAsNonRoot: true
          runAsUser: &uid 568
          runAsGroup: *uid
          fsGroup: *uid
          fsGroupChangePolicy: OnRootMismatch
          supplementalGroups: [*uid]
          seccompProfile:
            type: RuntimeDefault
      service:
        app:
          forceRename: home-assistant
          primary: true
          type: LoadBalancer
          annotations:
            external-dns.kubernetes.io/hostname: infra-home-assistant
          labels:
            io.cilium/lb-pool: pool-infra-home-assistant
          ports:
            http:
              port: *port
        codeserver:
          controller: app
          ports:
            codeserver:
              port: *port-cs
      persistence:
        config:
          existingClaim: home-assistant-data
          globalMounts:
            - path: /config
        tmp:
          type: emptyDir
          globalMounts:
            - path: /tmp
        home-assistant-fixes:
          type: configMap
          name: home-assistant-fixes
          advancedMounts:
            app:
              app:
                # TODO: drop once https://github.com/gurumitts/pylutron-caseta/pull/218 ships.
                - path: /usr/local/lib/python3.14/site-packages/pylutron_caseta/smartbridge.py
                  subPath: smartbridge.py
                  readOnly: true

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: home-assistant-kopiur
    namespace: home-assistant
    version: 0.1.0
    valuesInline:
      uid: 568
      gid: 568
      persistence:
        home-assistant-data:
          retain: true
          accessMode: ReadWriteOnce
          size: 20Gi
          storageClass: local-db

components:
  - ../../../../components/disable-revision-history
