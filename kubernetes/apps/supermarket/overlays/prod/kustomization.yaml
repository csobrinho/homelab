# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secrets/supermarket-secret-enc.yaml
  - https://github.com/csobrinho/supermarket-api//prometheus?ref=7205249d1ee50e950859b1f61ba3eef966c769a7

helmCharts:
  - name: supermarket
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: supermarket
    namespace: tools
    version: 0.1.0
    valuesInline:
      image: ghcr.io/csobrinho/supermarket-api:main@sha256:dd4a84b260ba3861ed50c85a71aeb41a613e94aab662c0ca8ebcd0eaf3e4fb3f
      users:
        - name: sobry
          schedule: "0 * * * *"
        - name: judy
          schedule: "2 * * * *"
