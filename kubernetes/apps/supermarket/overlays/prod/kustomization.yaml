# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secrets/supermarket-secret-enc.yaml
  - https://github.com/csobrinho/supermarket-api//prometheus?ref=7205249d1ee50e950859b1f61ba3eef966c769a7

helmCharts:
  - name: supermarket
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: supermarket
    namespace: tools
    version: 0.1.0
    valuesInline:
      image: ghcr.io/csobrinho/supermarket-api:main@sha256:5cfeee2a4772306d8f9044faa0b8c9a050c17445ef46d7af802065e27c61b168
      users:
        - name: sobry
          schedule: "0 * * * *"
        - name: judy
          schedule: "2 * * * *"
