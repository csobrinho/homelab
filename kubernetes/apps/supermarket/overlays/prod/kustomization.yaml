# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secrets/supermarket-secret-enc.yaml
  - https://github.com/csobrinho/supermarket-api//prometheus?ref=7205249d1ee50e950859b1f61ba3eef966c769a7

helmCharts:
  - name: supermarket
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: supermarket
    namespace: tools
    version: 0.1.0
    valuesInline:
      image: ghcr.io/csobrinho/supermarket-api:main@sha256:a37a56cd5d94c7fe0c780e7ab180034ea18ceb34c286eadc519f735fcc76c749
      users:
        - name: sobry
          schedule: "0 * * * *"
        - name: judy
          schedule: "2 * * * *"
