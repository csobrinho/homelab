# From https://github.com/trueforge-org/truecharts/blob/master/charts/library/common/values.yaml
# From https://github.com/trueforge-org/truecharts/blob/master/charts/stable/mosquitto/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route-mqtt.yaml

helmCharts:
  - name: mosquitto
    repo: oci://oci.trueforge.org/truecharts
    releaseName: mosquitto
    namespace: mosquitto
    version: 18.7.0
    includeCRDs: true
    valuesInline:
      TZ: America/Los_Angeles
      service:
        websockets:
          enabled: false
      auth:
        enabled: true
      persistence:
        data:
          enabled: true
          retain: true
          storageClass: "ceph-block"
          accessMode: ReadWriteOnce
          size: 2Gi
        configinc:
          enabled: true
          retain: true
          storageClass: "ceph-block"
          accessMode: ReadWriteOnce
          size: 256Mi

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: mosquitto-kopiur
    namespace: mosquitto
    version: 0.1.0
    valuesInline:
      # yaml-language-server: $schema=https://raw.githubusercontent.com/csobrinho/helm-charts/refs/heads/main/charts/kopiur-pvc/values.schema.json
      uid: 568
      gid: 568
      backup:
        schedule:
          cron: "" # Disable the automatic backup schedule.
      persistence:
        mosquitto-data:
          existingClaim: true
        mosquitto-configinc:
          existingClaim: true
