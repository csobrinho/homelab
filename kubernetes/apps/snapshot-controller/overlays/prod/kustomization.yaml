# See https://github.com/home-operations/helm-charts/blob/main/charts/snapshot-controller/values.yaml
# See https://github.com/kubernetes-csi/external-snapshotter/
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

helmCharts:
  - name: snapshot-controller
    repo: oci://ghcr.io/home-operations/charts
    releaseName: snapshot-controller
    namespace: kube-system
    version: 0.1.0
    includeCRDs: true
    valuesInline:
      replicaCount: 2
      monitoring:
        serviceMonitor:
          enabled: true
