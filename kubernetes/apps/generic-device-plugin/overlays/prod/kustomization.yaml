# From https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/explorer/
# From https://github.com/squat/generic-device-plugin/blob/main/manifests/generic-device-plugin.yaml
# yaml-language-server: $schema=../../../../fixes/kustomization.schema.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    releaseName: generic-device-plugin
    version: 5.3.0
    namespace: generic-device-plugin
    valuesFile: values-empty.yaml
    valuesInline:
      controllers:
        generic-device-plugin:
          type: daemonset
          pod:
            priorityClassName: system-node-critical
            tolerations:
              - operator: Exists
                effect: NoExecute
              - operator: Exists
                effect: NoSchedule
          containers:
            app:
              image:
                repository: ghcr.io/squat/generic-device-plugin
                tag: latest@sha256:8dc84958301f054bf72d9753a7a2c9af3d6642a9844b34d1171b3f2cdb4a15f6
                pullPolicy: IfNotPresent
              # Pods request a device with `resources.limits: {devic.es/<name>: 1}`.
              args:
                - --domain=devic.es
                - --log-level=info
                - --device
                # udev symlinks, see talos/workers.yaml.j2.
                - |
                  name: zwave
                  groups:
                    - paths:
                        - path: /dev/zwave
                          mountPath: /dev/zwave
                - --device
                - |
                  name: zigbee
                  groups:
                    - paths:
                        - path: /dev/zigbee
                          mountPath: /dev/zigbee
              securityContext:
                privileged: true
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
      persistence:
        device-plugins:
          type: hostPath
          hostPath: /var/lib/kubelet/device-plugins
          globalMounts:
            - path: /var/lib/kubelet/device-plugins
        dev:
          type: hostPath
          hostPath: /dev
          globalMounts:
            - path: /dev

components:
  - ../../../../components/disable-revision-history
