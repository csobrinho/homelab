kind: IngressRoute
apiVersion: traefik.io/v1alpha1
metadata:
  name: rustfs-s3-ingress
  namespace: rustfs
  annotations:
    external-dns.alpha.kubernetes.io/target: infra-int
spec:
  entryPoints:
    - websecure
    # - websecure-ext - keep the S3 API internal-only
  routes:
    - match: Host(`s3.sobrinho.pt`)
      kind: Rule
      services:
        - name: rustfs
          port: s3
  tls:
    secretName: rustfs-cert
---
# Web console — rustfs.sobrinho.pt
kind: IngressRoute
apiVersion: traefik.io/v1alpha1
metadata:
  name: rustfs-console-ingress
  namespace: rustfs
  annotations:
    external-dns.alpha.kubernetes.io/target: infra-int
spec:
  entryPoints:
    - websecure
    - websecure-ext
  routes:
    - match: Host(`rustfs.sobrinho.pt`)
      kind: Rule
      services:
        - name: rustfs
          port: console
  tls:
    secretName: rustfs-cert
---
kind: Certificate
apiVersion: cert-manager.io/v1
metadata:
  name: rustfs-cert
  namespace: rustfs
spec:
  secretName: rustfs-cert
  dnsNames:
    - s3.sobrinho.pt
    - rustfs.sobrinho.pt
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
