# From https://github.com/8gears/n8n-helm-chart/blob/main/charts/n8n/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml
  - secrets/n8n-secret-enc.yaml

helmCharts:
  - name: n8n
    repo: oci://8gears.container-registry.com/library
    releaseName: n8n
    namespace: n8n
    version: 2.1.1
    includeCRDs: true
    valuesInline:
      image:
        repository: ghcr.io/n8n-io/n8n
        pullPolicy: IfNotPresent
        tag: 2.41.3
      main:
        replicaCount: 1
        config:
          n8n:
            editor:
              base_url: https://n8n.sobrinho.pt/
            templates:
              enabled: "true"
            enforce:
              settings_file_permissions: "true"
          db:
            type: sqlite
          generic:
            timezone: America/Los_Angeles
          queue:
            health:
              check:
                active: true
            bull:
              redis:
                host: valkey.infra.svc.cluster.local
                port: 6379
                db: 2 # See kubernetes/apps/valkey/overlays/prod/kustomization.yaml
        persistence:
          enabled: true
          type: existing
          existingClaim: n8n
        extraEnv:
          EXECUTIONS_MODE:
            value: "regular"
          N8N_PROXY_HOPS:
            value: "1"
          N8N_PORT:
            value: "5678"
          N8N_MIGRATE_FS_STORAGE_PATH:
            value: "true"
          N8N_UNVERIFIED_PACKAGES_ENABLED:
            value: "true"
          N8N_RUNNERS_TASK_TIMEOUT:
            value: "300"
          N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES:
            value: "2147483648"
          N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES:
            value: "5000"
          N8N_ENCRYPTION_KEY:
            valueFrom:
              secretKeyRef:
                name: n8n-secret
                key: encryption-key
          N8N_RUNNERS_MODE:
            value: "external"
          N8N_NATIVE_PYTHON_RUNNER:
            value: "true"
          N8N_RUNNERS_AUTH_TOKEN:
            valueFrom:
              secretKeyRef:
                name: n8n-secret
                key: runners-auth-token
        initContainers:
          - name: task-runners
            image: ghcr.io/n8n-io/runners:2.41.3@sha256:1522f8179b76adcdb7900864c18b2ec57d63af472baeed874ed220bab3e66ecc
            restartPolicy: Always
            env:
              - name: N8N_RUNNERS_TASK_BROKER_URI
                value: http://127.0.0.1:5679
              - name: N8N_RUNNERS_AUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: n8n-secret
                    key: runners-auth-token
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 768Mi
      worker:
        enabled: false
      webhook:
        enabled: false
      valkey:
        enabled: false

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: n8n-kopiur
    namespace: n8n
    version: 0.1.0
    valuesInline:
      uid: 1000
      gid: 1000
      persistence:
        n8n:
          retain: true
          accessMode: ReadWriteOnce
          size: 4Gi
          storageClass: local-db
