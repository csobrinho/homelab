# From https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/explorer/
# yaml-language-server: $schema=../../../../fixes/kustomization.schema.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    releaseName: actual-budget
    version: 5.1.0
    namespace: actual-budget
    valuesFile: values-empty.yaml
    valuesInline:
      controllers:
        app:
          revisionHistoryLimit: 0
          containers:
            app:
              image:
                repository: ghcr.io/actualbudget/actual
                tag: 26.8.1@sha256:6478d9ddfc0924479c09e6699c205e354c6f2216dfe7de3c0fb7b590d6edcdc5
                pullPolicy: IfNotPresent
              env:
                TZ: America/Los_Angeles
                ACTUAL_TRUSTED_PROXIES: "10.0.0.0/8"
              probes:
                liveness: &probe
                  enabled: true
                  custom: true
                  spec:
                    exec:
                      command: ["node", "src/scripts/health-check.js"]
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 5
                readiness:
                  <<: *probe
                  spec:
                    exec:
                      command: ["node", "src/scripts/health-check.js"]
                    periodSeconds: 10
                    timeoutSeconds: 10
                    failureThreshold: 5
                startup:
                  <<: *probe
                  spec:
                    exec:
                      command: ["node", "src/scripts/health-check.js"]
                    periodSeconds: 5
                    timeoutSeconds: 10
                    failureThreshold: 60
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 384Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
      defaultPodOptions:
        automountServiceAccountToken: false
        enableServiceLinks: false
        securityContext:
          runAsNonRoot: true
          runAsUser: &uid 568
          runAsGroup: *uid
          fsGroup: *uid
          fsGroupChangePolicy: OnRootMismatch
          supplementalGroups: [*uid]
          seccompProfile:
            type: RuntimeDefault
      service:
        app:
          primary: true
          ports:
            http:
              port: 5006
      persistence:
        data:
          existingClaim: actual-budget-data
          globalMounts:
            - path: /data

  - name: kopiur-pvc
    repo: oci://ghcr.io/csobrinho/helm-charts
    releaseName: actual-budget-kopiur
    namespace: actual-budget
    version: 0.1.0
    valuesInline:
      uid: 568
      gid: 568
      persistence:
        actual-budget-data:
          retain: true
          accessMode: ReadWriteOnce
          size: 512Mi
          storageClass: local-data
