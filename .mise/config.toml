# Adapted from https://github.com/onedr0p/home-ops
[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

#[hooks]
#postinstall = "lefthook install"

[tools]
actionlint = "1.7.12"
"github:mitsuhiko/minijinja" = "2.24.0"
jq = "1.8.2"
just = "1.58.0"
lefthook = "2.1.12"
node = "26.8.1"
oxfmt = "0.65.0"
shellcheck = "0.11.0"
talos = "1.14.0-rc.2"
yq = "4.53.6"
zizmor = "1.29.0"
age = "1.3.1"
sops = "3.13.3"
claude = "2.1.251"
opentofu = "1.12.6"
cilium-cli = "0.20.0"
k9s = "0.51.0"
helm = "4.2.4"
kubeseal = "0.39.1"
ripgrep = "15.2.0"
