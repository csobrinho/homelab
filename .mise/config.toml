# Adapted from https://github.com/onedr0p/home-ops
[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

#[hooks]
#postinstall = "lefthook install"

[tools]
actionlint = "1.7.12"
"github:mitsuhiko/minijinja" = "2.24.0"
jq = "1.8.2"
just = "1.58.0"
lefthook = "2.1.14"
node = "26.10.0"
oxfmt = "0.70.0"
shellcheck = "0.11.0"
talos = "1.14.1"
yq = "4.53.6"
zizmor = "1.30.1"
age = "1.3.2"
sops = "3.13.3"
claude = "2.1.283"
opentofu = "1.12.6"
cilium-cli = "0.20.1"
k9s = "0.51.0"
helm = "4.3.0"
kubeseal = "0.40.0"
ripgrep = "15.2.0"
argocd = "3.5.3"
kubecolor = "0.8.0"
