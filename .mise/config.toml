# Adapted from https://github.com/onedr0p/home-ops
[env]
KUBECONFIG = "$HOME/.kube/config"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

[hooks]
postinstall = "lefthook install"

[tools]
actionlint = "1.7.12"
"github:mitsuhiko/minijinja" = "2.24.0"
jq = "1.8.2"
just = "1.58.0"
lefthook = "2.1.12"
node = "26.8.1"
oxfmt = "0.65.0"
shellcheck = "0.11.0"
talos = "1.14.0-beta.1"
yq = "4.53.6"
zizmor = "1.29.0"
