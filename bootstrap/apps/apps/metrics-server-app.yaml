apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-90"
spec:
  destination:
    namespace: kube-system
    name: in-cluster
  project: default
  source:
    path: apps/metrics-server/overlays/prod
    repoURL: https://github.com/csobrinho/homelab
  ignoreDifferences: []
