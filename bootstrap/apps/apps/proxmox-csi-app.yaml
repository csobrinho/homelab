apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proxmox-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
spec:
  destination:
    namespace: csi-proxmox
    name: in-cluster
  project: default
  source:
    path: apps/proxmox-csi/overlays/prod
    repoURL: https://github.com/csobrinho/homelab
  ignoreDifferences: []
