apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  destination:
    namespace: argocd
    name: in-cluster
  project: default
  source:
    path: apps/argocd/overlays/prod
    repoURL: https://github.com/csobrinho/homelab
  ignoreDifferences: []
