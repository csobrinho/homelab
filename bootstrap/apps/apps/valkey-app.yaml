apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
spec:
  destination:
    namespace: infra
    name: in-cluster
  project: default
  source:
    path: apps/valkey/overlays/prod
    repoURL: https://github.com/csobrinho/homelab
  ignoreDifferences: []
