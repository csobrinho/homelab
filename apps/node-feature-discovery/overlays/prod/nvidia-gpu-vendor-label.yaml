apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: nvidia-gpu-vendor-label
  namespace: tools
spec:
  rules:
    - name: nvidia-pci-vendor
      labels:
        pci-10de.present: "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: { op: In, value: ["10de"] }
