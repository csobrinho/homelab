# From https://github.com/trueforge-org/truecharts/blob/master/charts/library/common/values.yaml
# From https://github.com/trueforge-org/truecharts/blob/master/charts/stable/plex/values.yaml
# yaml-language-server: $schema=https://www.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1n.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-route.yaml

helmCharts:
  - name: plex
    repo: oci://oci.trueforge.org/truecharts
    releaseName: plex
    namespace: media
    version: 22.3.0
    includeCRDs: true
    valuesInline:
      TZ: America/Los_Angeles
      podOptions:
        defaultAffinity: false
        nodeSelector:
          kubernetes.io/arch: "amd64"
      service:
        main:
          externalTrafficPolicy: Local
          annotations:
            external-dns.alpha.kubernetes.io/hostname: infra-plex
          labels:
            io.cilium/lb-pool: pool-infra-plex
          type: LoadBalancer
      persistence:
        config:
          enabled: true
          retain: true
          storageClass: "ceph-block"
          accessMode: ReadWriteOnce
          size: 16Gi
        transcode:
          enabled: true
          type: nfs
          path: /data/media/transcode
          server: infra31
          mountPath: /transcode
          size: 16Gi
        media:
          enabled: true
          type: nfs
          path: /data
          server: infra31
          mountPath: /data
      plex:
        serverIP: 10.10.10.29 # infra-plex VIP.
        additionalAdvertiseURL: "https://plex.sobrinho.pt:443"
      resources:
        limits:
          gpu.intel.com/i915: "1"
          cpu: 3000m
          memory: 8Gi
        requests:
          gpu.intel.com/i915: "1"
          cpu: 500m
          memory: 512Mi
      securityContext:
        pod:
          supplementalGroups: [105] # Add render group.
